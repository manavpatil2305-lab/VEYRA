<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>veyra</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#202C33">
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for webkit to match mobile feel */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374045; border-radius: 4px; }
    </style>
</head>
<body class="bg-[#111B21] text-[#E9EDEF] font-sans h-screen flex flex-col overflow-hidden">

    <!-- Top App Bar -->
    <header class="bg-[#202C33] p-4 flex justify-between items-center shadow-md z-10">
        <h1 class="text-xl font-semibold text-gray-200">veyra</h1>
        <div class="flex gap-5 text-gray-400 text-lg">
            <span class="cursor-pointer hover:text-white transition">📷</span>
            <span class="cursor-pointer hover:text-white transition">🔍</span>
            <span class="cursor-pointer hover:text-white transition">⋮</span>
        </div>
    </header>

    <!-- Chat List Area -->
    <main class="flex-1 overflow-y-auto">
        
        <!-- Single Chat Row -->
        <div class="flex items-center gap-4 p-3 hover:bg-[#202C33] cursor-pointer transition">
            <!-- Avatar -->
            <div class="w-12 h-12 bg-gray-600 rounded-full flex-shrink-0 relative">
                <!-- Online Status Dot (Optional) -->
                <div class="absolute bottom-0 right-0 w-3 h-3 bg-[#00A884] rounded-full border-2 border-[#111B21]"></div>
            </div>
            
            <!-- Message Preview -->
            <div class="flex-1 border-b border-[#202C33] pb-3 pt-1">
                <div class="flex justify-between items-center">
                    <h2 class="text-lg font-medium">Rahul Desai</h2>
                    <span class="text-xs text-[#00A884]">10:45 AM</span>
                </div>
                <div class="flex justify-between items-center mt-1">
                    <p class="text-sm text-gray-400 truncate w-4/5">Are we still on for the 5 PM meeting?</p>
                    <!-- Unread Badge -->
                    <div class="w-5 h-5 bg-[#00A884] rounded-full flex items-center justify-center text-[10px] text-[#111B21] font-bold">
                        2
                    </div>
                </div>
            </div>
        </div>

    </main>

</body>
</html>
