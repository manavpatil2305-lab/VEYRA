<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>veyra</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0B141A">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { display: none; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-[#0B141A] text-[#E9EDEF] font-sans h-screen flex flex-col overflow-hidden relative">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="h-full flex flex-col items-center justify-center px-6 absolute top-0 left-0 w-full bg-[#0B141A] z-50">
        <h1 class="text-4xl font-bold text-white mb-8">veyra</h1>
        <p class="text-gray-400 mb-8 text-center">Sign in securely to start messaging</p>
        <button id="google-login-btn" class="w-full max-w-sm bg-white text-black font-bold py-3 px-4 rounded-full shadow-lg flex items-center justify-center gap-3 cursor-pointer">
            <svg class="w-6 h-6" viewBox="0 0 24 24">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Continue with Google
        </button>
    </div>

    <!-- CHOOSE USERNAME SCREEN -->
    <div id="username-screen" class="hidden h-full flex flex-col items-center justify-center px-6 absolute top-0 left-0 w-full bg-[#0B141A] z-50">
        <h2 class="text-2xl font-bold text-white mb-2">Create your Veyra ID</h2>
        <p class="text-gray-400 mb-8 text-center text-sm">This is how friends will find you. No emails shared.</p>
        <div class="w-full max-w-sm bg-[#202C33] rounded-lg p-4 flex items-center gap-3 mb-6">
            <span class="text-gray-500 font-bold">@</span>
            <input type="text" id="username-input" placeholder="manav_23" class="bg-transparent outline-none text-white w-full lowercase">
        </div>
        <button id="save-username-btn" class="w-full max-w-sm bg-[#25D366] text-[#0B141A] font-bold py-3 rounded-full cursor-pointer">Complete Profile</button>
    </div>

    <!-- MAIN APP UI -->
    <div id="main-app" class="hidden flex-col h-full w-full">
        <header class="pt-4 pb-2 px-4 flex justify-between items-center bg-[#0B141A]">
            <h1 class="text-2xl font-bold text-white">veyra</h1>
            <div class="flex gap-6 text-xl items-center">
                <span class="cursor-pointer">📷</span>
                <span class="cursor-pointer">⋮</span>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="px-4 py-2 relative">
            <div class="bg-[#202C33] rounded-full flex items-center px-4 py-2 gap-3">
                <span class="text-gray-400">🔍</span>
                <input type="text" id="search-users-input" placeholder="Search username to chat..." class="bg-transparent outline-none text-sm w-full text-white">
            </div>
            <!-- Search Results Dropdown -->
            <div id="search-results" class="hidden absolute top-14 left-4 right-4 bg-[#202C33] rounded-xl shadow-xl z-30 p-2 flex-col gap-1 max-h-60 overflow-y-auto"></div>
        </div>

        <main class="flex-1 overflow-y-auto relative pb-20" id="recent-chats-list">
            <div class="p-4 text-center text-gray-500 text-sm mt-10">Search a username above to start a private chat!</div>
        </main>

        <nav class="bg-[#0B141A] border-t border-[#202C33] flex justify-around items-center px-2 py-2 pb-4 absolute bottom-0 w-full z-20">
            <div id="nav-chats" class="flex flex-col items-center gap-1 cursor-pointer w-20">
                <div class="relative px-4 py-1 bg-[#0A332C] rounded-full"><span class="text-white text-xl">💬</span></div>
                <span class="text-xs text-white font-medium">Chats</span>
            </div>
            <div id="nav-settings" class="flex flex-col items-center gap-1 cursor-pointer opacity-60 w-20">
                <div class="relative px-4 py-1 rounded-full"><span class="text-white text-xl">⚙️</span></div>
                <span class="text-xs text-white">Settings</span>
            </div>
        </nav>
    </div>

    <!-- SETTINGS SCREEN -->
    <div id="settings-screen" class="hidden flex-col h-full w-full bg-[#0B141A] absolute top-0 left-0 z-10 pb-20">
        <header class="pt-6 pb-4 px-4 border-b border-[#202C33]"><h1 class="text-2xl font-bold text-white">Settings</h1></header>
        <div class="p-4 flex items-center gap-4 border-b border-[#202C33]">
            <div id="settings-profile-pic" class="w-16 h-16 bg-gray-600 rounded-full bg-cover bg-center"></div>
            <div>
                <h2 id="settings-name" class="text-xl font-normal text-white">User</h2>
                <p id="settings-username" class="text-sm text-[#25D366]">@username</p>
            </div>
        </div>
        <div class="p-4 mt-2">
            <h3 class="text-[#25D366] text-sm font-semibold mb-4">PRIVACY</h3>
            <div class="bg-[#111B21] rounded-xl p-4 shadow-sm">
                <h4 class="text-white text-lg">Default Message Timer</h4>
                <select id="disappearing-timer" class="w-full mt-2 bg-[#202C33] text-white p-3 rounded-lg outline-none cursor-pointer">
                    <option value="off">Off</option>
                    <option value="view-once">View Once</option>
                    <option value="7-hours">7 Hours</option>
                    <option value="24-hours">24 Hours</option>
                </select>
            </div>
        </div>
        <div class="p-4"><button id="logout-btn" class="w-full bg-red-600/20 text-red-500 font-bold py-3 rounded-xl cursor-pointer">Log Out</button></div>
    </div>

    <!-- PRIVATE CHAT ROOM UI -->
    <div id="chat-room" class="hidden flex-col h-full w-full bg-[#0B141A] absolute top-0 left-0 z-50">
        <header class="pt-4 pb-2 px-4 flex items-center gap-4 bg-[#202C33] shadow-md z-10">
            <span id="back-btn" class="text-white text-2xl cursor-pointer">←</span>
            <div class="w-10 h-10 bg-gray-600 rounded-full flex-shrink-0" id="chat-header-pic" style="background-size: cover;"></div>
            <div class="flex-1">
                <h2 class="text-lg font-medium text-white" id="chat-header-name">Name</h2>
                <span class="text-xs text-[#25D366]" id="chat-header-username">@username</span>
            </div>
            <div class="flex gap-4 text-xl items-center"><span class="cursor-pointer text-white">📞</span></div>
        </header>
        <main id="messages-area" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3 relative bg-[#0B141A]" style="background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-size: cover;"></main>
        <footer class="bg-[#202C33] p-2 flex items-center gap-2 pb-4">
            <span class="text-gray-400 text-2xl px-2 cursor-pointer">+</span>
            <input type="text" id="message-input" placeholder="Message" class="flex-1 bg-[#2A3942] text-white rounded-full px-4 py-2 outline-none text-sm">
            <div id="send-btn" class="w-10 h-10 bg-[#25D366] rounded-full flex items-center justify-center cursor-pointer flex-shrink-0">
                <span class="text-[#0B141A] font-bold">➤</span>
            </div>
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, where, getDocs, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCAqrAiYLLnFoa_JmU8A3jXPk0KoZukCVk",
            authDomain: "veyra-chatbox.firebaseapp.com",
            projectId: "veyra-chatbox",
            storageBucket: "veyra-chatbox.firebasestorage.app",
            messagingSenderId: "443166587498",
            appId: "1:443166587498:web:75577c5660eae841566813"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let currentUserData = null;
        let activeChatId = null; 
        let currentChatListener = null;

        const loginScreen = document.getElementById('login-screen');
        const usernameScreen = document.getElementById('username-screen');
        const mainApp = document.getElementById('main-app');
        const chatRoom = document.getElementById('chat-room');
        const searchInput = document.getElementById('search-users-input');
        const searchResults = document.getElementById('search-results');
        
        // Instant Auth State Handler
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                // Hide login screen instantly
                loginScreen.classList.add('hidden');
                loginScreen.classList.remove('flex');

                // Check username in background
                const userDoc = await getDoc(doc(db, "users", user.uid));
                
                if (userDoc.exists() && userDoc.data().username) {
                    currentUserData = userDoc.data();
                    document.getElementById('settings-name').textContent = currentUserData.name;
                    document.getElementById('settings-username').textContent = "@" + currentUserData.username;
                    if(currentUserData.photoUrl) document.getElementById('settings-profile-pic').style.backgroundImage = `url('${currentUserData.photoUrl}')`;
                    
                    showScreen(mainApp);
                } else {
                    showScreen(usernameScreen);
                }
            } else {
                showScreen(loginScreen);
            }
        });

        document.getElementById('google-login-btn').addEventListener('click', () => {
            signInWithPopup(auth, provider);
        });

        document.getElementById('save-username-btn').addEventListener('click', async () => {
            const rawUsername = document.getElementById('username-input').value.trim().toLowerCase();
            if(rawUsername.length < 3) return alert("Username must be at least 3 characters");

            await setDoc(doc(db, "users", currentUser.uid), {
                uid: currentUser.uid,
                name: currentUser.displayName,
                email: currentUser.email,
                photoUrl: currentUser.photoURL,
                username: rawUsername,
                joinedAt: serverTimestamp()
            });
            window.location.reload();
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        // Search Users
        searchInput.addEventListener('input', async (e) => {
            const val = e.target.value.trim().toLowerCase();
            if(val.length < 2) { searchResults.classList.add('hidden'); return; }

            const q = query(collection(db, "users"), where("username", ">=", val), where("username", "<=", val + '\uf8ff'));
            const querySnapshot = await getDocs(q);
            
            searchResults.innerHTML = "";
            let found = false;

            querySnapshot.forEach((docSnap) => {
                const userObj = docSnap.data();
                if(userObj.uid === currentUser.uid) return;
                found = true;
                
                const div = document.createElement('div');
                div.className = "flex items-center gap-3 p-2 hover:bg-[#2A3942] rounded-lg cursor-pointer";
                div.innerHTML = `
                    <div class="w-10 h-10 bg-gray-600 rounded-full" style="background-image: url('${userObj.photoUrl}'); background-size: cover;"></div>
                    <div>
                        <h4 class="text-white text-sm">${userObj.name}</h4>
                        <p class="text-xs text-[#25D366]">@${userObj.username}</p>
                    </div>
                `;
                div.addEventListener('click', () => openPrivateChat(userObj));
                searchResults.appendChild(div);
            });

            if(!found) searchResults.innerHTML = `<div class="p-2 text-gray-400 text-sm">No users found</div>`;
            searchResults.classList.remove('hidden');
        });

        document.addEventListener('click', (e) => {
            if(e.target !== searchInput) searchResults.classList.add('hidden');
        });

        function openPrivateChat(otherUser) {
            searchInput.value = "";
            searchResults.classList.add('hidden');
            
            const uids = [currentUser.uid, otherUser.uid].sort();
            activeChatId = `${uids[0]}_${uids[1]}`;

            document.getElementById('chat-header-name').textContent = otherUser.name;
            document.getElementById('chat-header-username').textContent = "@" + otherUser.username;
            if(otherUser.photoUrl) document.getElementById('chat-header-pic').style.backgroundImage = `url('${otherUser.photoUrl}')`;

            showScreen(chatRoom);
            loadPrivateMessages();
        }

        document.getElementById('back-btn').addEventListener('click', () => {
            if(currentChatListener) currentChatListener();
            activeChatId = null;
            showScreen(mainApp);
        });

        document.getElementById('send-btn').addEventListener('click', async () => {
            const text = document.getElementById('message-input').value.trim();
            const timer = document.getElementById('disappearing-timer').value;
            if (!text || !activeChatId) return;

            document.getElementById('message-input').value = "";
            await addDoc(collection(db, `chats/${activeChatId}/messages`), {
                text: text,
                senderUid: currentUser.uid,
                timer: timer,
                timestamp: serverTimestamp()
            });
        });

        document.getElementById('message-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('send-btn').click();
        });

        function loadPrivateMessages() {
            const messagesArea = document.getElementById('messages-area');
            const q = query(collection(db, `chats/${activeChatId}/messages`), orderBy("timestamp", "asc"));
            
            if(currentChatListener) currentChatListener();

            currentChatListener = onSnapshot(q, (snapshot) => {
                messagesArea.innerHTML = ""; 
                snapshot.forEach((doc) => {
                    const msg = doc.data();
                    const isMe = msg.senderUid === currentUser.uid;
                    const timerIcon = msg.timer && msg.timer !== "off" ? "⏱️" : "";

                    const div = document.createElement('div');
                    div.className = isMe 
                        ? "self-end max-w-[80%] bg-[#005C4B] text-white rounded-lg p-2 rounded-tr-none shadow" 
                        : "self-start max-w-[80%] bg-[#202C33] text-white rounded-lg p-2 rounded-tl-none shadow";
                    div.innerHTML = `
                        <p class="text-sm">${msg.text}</p>
                        <div class="flex justify-end mt-1 text-[10px] ${isMe ? 'text-gray-300' : 'text-gray-400'} items-center gap-1">
                            <span>${timerIcon}</span><span>${isMe ? '✓✓' : ''}</span>
                        </div>
                    `;
                    messagesArea.appendChild(div);
                });
                messagesArea.scrollTop = messagesArea.scrollHeight;
            });
        }

        function showScreen(screenEl) {
            [loginScreen, usernameScreen, mainApp, document.getElementById('settings-screen'), chatRoom].forEach(el => {
                if(el) { el.classList.add('hidden'); el.classList.remove('flex'); }
            });
            screenEl.classList.remove('hidden');
            screenEl.classList.add('flex');
        }

        document.getElementById('nav-settings').addEventListener('click', () => showScreen(document.getElementById('settings-screen')));
        document.getElementById('nav-chats').addEventListener('click', () => showScreen(mainApp));
    </script>
</body>
</html>
