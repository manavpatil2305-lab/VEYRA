<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>veyra</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0B141A">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { display: none; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-[#0B141A] text-[#E9EDEF] font-sans h-screen flex flex-col overflow-hidden relative">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="h-full flex flex-col items-center justify-center px-6 absolute top-0 left-0 w-full bg-[#0B141A] z-50">
        <h1 class="text-4xl font-bold text-white mb-8">veyra</h1>
        <p class="text-gray-400 mb-6 text-center">Enter your phone number to get started</p>
        
        <div class="w-full max-w-sm bg-[#202C33] rounded-lg p-4 flex items-center gap-3 mb-6">
            <span class="text-white border-r border-gray-600 pr-3">+91</span>
            <input type="tel" id="phone-input" placeholder="Phone number" class="bg-transparent outline-none text-white w-full">
        </div>
        
        <div id="recaptcha-container" class="mb-4"></div>
        
        <button id="send-otp-btn" class="w-full max-w-sm bg-[#25D366] text-[#0B141A] font-bold py-3 rounded-full shadow-lg">Send OTP</button>

        <div id="otp-section" class="w-full max-w-sm hidden mt-6 flex-col items-center">
            <input type="text" id="otp-input" placeholder="Enter 6-digit OTP" class="bg-[#202C33] outline-none text-white w-full rounded-lg p-4 mb-4 text-center tracking-widest">
            <button id="verify-otp-btn" class="w-full bg-[#25D366] text-[#0B141A] font-bold py-3 rounded-full shadow-lg">Verify OTP</button>
        </div>
    </div>

    <!-- MAIN APP UI (Chat List) -->
    <div id="main-app" class="flex flex-col h-full w-full">
        <header class="pt-4 pb-2 px-4 flex justify-between items-center bg-[#0B141A]">
            <h1 class="text-2xl font-bold text-white">veyra</h1>
            <div class="flex gap-6 text-xl items-center">
                <span class="cursor-pointer">📷</span>
                <span class="cursor-pointer">⋮</span>
            </div>
        </header>

        <div class="px-4 py-2">
            <div class="bg-[#202C33] rounded-full flex items-center px-4 py-2 gap-3">
                <span class="text-gray-400">🔍</span>
                <input type="text" placeholder="Search chats..." class="bg-transparent outline-none text-sm w-full text-white placeholder-gray-400">
            </div>
        </div>

        <main class="flex-1 overflow-y-auto relative pb-20">
            <!-- Clickable Chat Row -->
            <div id="dummy-chat-btn" class="flex items-center gap-4 px-4 py-3 hover:bg-[#202C33] cursor-pointer">
                <div class="w-12 h-12 bg-gray-600 rounded-full flex-shrink-0"></div>
                <div class="flex-1 flex flex-col justify-center">
                    <div class="flex justify-between items-center">
                        <h2 class="text-lg font-normal">Rahul Desai</h2>
                        <span class="text-xs text-[#25D366]">4:13 pm</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <p class="text-sm text-gray-400 truncate w-4/5">Are we still on for the 5 PM meeting?</p>
                        <div class="w-5 h-5 bg-[#25D366] rounded-full flex items-center justify-center text-[10px] text-[#0B141A] font-bold">1</div>
                    </div>
                </div>
            </div>
        </main>

        <div class="absolute bottom-24 right-4 flex flex-col items-center gap-3">
            <div class="w-14 h-14 bg-[#25D366] rounded-[16px] flex items-center justify-center shadow-lg cursor-pointer">
                <span class="text-[#0B141A] text-2xl font-bold">+</span>
            </div>
        </div>

        <nav class="bg-[#0B141A] border-t border-[#202C33] flex justify-around items-center px-2 py-2 pb-4 absolute bottom-0 w-full z-20">
            <div class="flex flex-col items-center gap-1 cursor-pointer w-20">
                <div class="relative px-4 py-1 bg-[#0A332C] rounded-full"><span class="text-white text-xl">💬</span></div>
                <span class="text-xs text-white font-medium">Chats</span>
            </div>
            <div class="flex flex-col items-center gap-1 cursor-pointer opacity-60 w-20">
                <span class="text-white text-xl">📞</span>
                <span class="text-xs text-white">Calls</span>
            </div>
            <div class="flex flex-col items-center gap-1 cursor-pointer opacity-60 w-20">
                <span class="text-white text-xl">⚙️</span>
                <span class="text-xs text-white">Settings</span>
            </div>
        </nav>
    </div>

    <!-- INDIVIDUAL CHAT ROOM UI (Hidden by default) -->
    <div id="chat-room" class="hidden flex-col h-full w-full bg-[#0B141A] absolute top-0 left-0 z-40">
        <!-- Chat Header -->
        <header class="pt-4 pb-2 px-4 flex items-center gap-4 bg-[#202C33] shadow-md z-10">
            <span id="back-btn" class="text-white text-2xl cursor-pointer">←</span>
            <div class="w-10 h-10 bg-gray-600 rounded-full flex-shrink-0"></div>
            <div class="flex-1">
                <h2 class="text-lg font-medium text-white">Rahul Desai</h2>
                <span class="text-xs text-gray-400">Online</span>
            </div>
            <div class="flex gap-4 text-xl items-center">
                <span class="cursor-pointer text-white">📞</span>
                <span class="cursor-pointer text-white">⋮</span>
            </div>
        </header>

        <!-- Messages Area -->
        <main class="flex-1 overflow-y-auto p-4 flex flex-col gap-2 relative bg-[#0B141A]" style="background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-size: cover;">
            <!-- Dummy Received Message -->
            <div class="self-start max-w-[80%] bg-[#202C33] text-white rounded-lg p-2 rounded-tl-none shadow">
                <p class="text-sm">Hey, the app is looking great!</p>
                <div class="flex justify-end mt-1 text-[10px] text-gray-400">
                    <span>10:45 AM</span>
                </div>
            </div>
            <!-- Dummy Sent Message -->
            <div class="self-end max-w-[80%] bg-[#005C4B] text-white rounded-lg p-2 rounded-tr-none shadow">
                <p class="text-sm">Thanks bro, adding real-time chat now.</p>
                <div class="flex justify-end items-center gap-1 mt-1 text-[10px] text-gray-300">
                    <span>10:46 AM</span>
                    <span class="text-[#34B7F1]">✓✓</span>
                </div>
            </div>
        </main>

        <!-- Input Bar -->
        <footer class="bg-[#202C33] p-2 flex items-center gap-2 pb-4">
            <span class="text-gray-400 text-2xl px-2 cursor-pointer">+</span>
            <input type="text" id="message-input" placeholder="Message" class="flex-1 bg-[#2A3942] text-white rounded-full px-4 py-2 outline-none text-sm">
            <div class="w-10 h-10 bg-[#25D366] rounded-full flex items-center justify-center cursor-pointer flex-shrink-0">
                <span class="text-[#0B141A] font-bold">➤</span>
            </div>
        </footer>
    </div>

    <!-- Firebase SDK Connections & Auth Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
        import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCAqrAiYLLnFoa_JmU8A3jXPk0KoZukCVk",
            authDomain: "veyra-chatbox.firebaseapp.com",
            projectId: "veyra-chatbox",
            storageBucket: "veyra-chatbox.firebasestorage.app",
            messagingSenderId: "443166587498",
            appId: "1:443166587498:web:75577c5660eae841566813",
            measurementId: "G-64PK736T85"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // UI Elements
        const loginScreen = document.getElementById('login-screen');
        const phoneInput = document.getElementById('phone-input');
        const sendOtpBtn = document.getElementById('send-otp-btn');
        const otpSection = document.getElementById('otp-section');
        const otpInput = document.getElementById('otp-input');
        const verifyOtpBtn = document.getElementById('verify-otp-btn');
        const recaptchaContainer = document.getElementById('recaptcha-container');
        
        // Chat UI Elements
        const dummyChatBtn = document.getElementById('dummy-chat-btn');
        const chatRoom = document.getElementById('chat-room');
        const backBtn = document.getElementById('back-btn');

        // 1. Initialize invisible Recaptcha
        window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
            'size': 'normal',
            'callback': (response) => {}
        });

        // 2. Send the OTP
        sendOtpBtn.addEventListener('click', () => {
            const phoneNumber = "+91" + phoneInput.value.trim();
            const appVerifier = window.recaptchaVerifier;

            signInWithPhoneNumber(auth, phoneNumber, appVerifier)
                .then((confirmationResult) => {
                    window.confirmationResult = confirmationResult;
                    sendOtpBtn.classList.add('hidden');
                    recaptchaContainer.classList.add('hidden');
                    otpSection.classList.remove('hidden');
                    otpSection.classList.add('flex');
                }).catch((error) => {
                    console.error("SMS not sent", error);
                    alert("Error sending OTP. Please try again.");
                });
        });

        // 3. Verify OTP and Save User to Database
        verifyOtpBtn.addEventListener('click', () => {
            const code = otpInput.value.trim();
            
            window.confirmationResult.confirm(code).then(async (result) => {
                const user = result.user;
                
                // SAVE USER PROFILE TO FIRESTORE
                await setDoc(doc(db, "users", user.uid), {
                    phoneNumber: user.phoneNumber,
                    isOnline: true,
                    lastSeen: serverTimestamp()
                }, { merge: true });
                
                // Hide Login Screen (reveals Main App behind it)
                loginScreen.classList.add('hidden');
                
            }).catch((error) => {
                console.error("Bad OTP", error);
                alert("Invalid OTP code. Try again.");
            });
        });

        // 4. Open and Close the Chat Room
        dummyChatBtn.addEventListener('click', () => {
            chatRoom.classList.remove('hidden');
            chatRoom.classList.add('flex');
        });

        backBtn.addEventListener('click', () => {
            chatRoom.classList.add('hidden');
            chatRoom.classList.remove('flex');
        });
    </script>
</body>
</html>
